services:
  db:
    image: mysql:8.3
    container_name: medsys-db
    environment:
      MYSQL_ROOT_PASSWORD: teste
      MYSQL_DATABASE: medsys
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p", "teste"]
      interval: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
